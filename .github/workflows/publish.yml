name: Publish to npm

# Publishes packages/audio-reader-highlight to npm.
# - Normal path: publishing a GitHub release tagged vX.Y.Z (the tag must match the package version).
# - Manual path: "Run workflow" on main, for a release whose tag predates a workflow fix. It refuses
#   to publish a version that is already on npm.
# It uses npm trusted publishing (OIDC): no npm token is stored anywhere. The package's npm settings
# list this repo and this workflow file (publish.yml) as a trusted publisher.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # lets npm verify this workflow and attach provenance

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # The site pins Node 22.x, but trusted publishing needs npm 11.5+ (Node 24). That pin is for
      # Vercel; the package itself supports any Node.
      YARN_IGNORE_ENGINES: '1'
    steps:
      - uses: actions/checkout@v7
      # No registry-url: it writes an .npmrc that references NODE_AUTH_TOKEN, which yarn 1 refuses to
      # run without. npm already defaults to registry.npmjs.org, and OIDC needs no token.
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # npm 11.5.1+ is required for trusted publishing
          cache: yarn
      - name: Check the version
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
          REF: ${{ github.ref_name }}
        run: |
          name="$(node -p "require('./packages/audio-reader-highlight/package.json').name")"
          version="$(node -p "require('./packages/audio-reader-highlight/package.json').version")"
          if [ "$EVENT" = "release" ] && [ "$TAG" != "v$version" ]; then
            echo "::error::Release tag $TAG does not match package version v$version"
            exit 1
          fi
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$REF" != "main" ]; then
            echo "::error::Manual publishing runs from main only"
            exit 1
          fi
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "::error::$name@$version is already on npm; bump the version first"
            exit 1
          fi
      - run: npm --version
      - run: yarn install --frozen-lockfile
      - run: yarn test
      - run: yarn build:package
      - run: ./scripts/smoke-pack.sh
      - name: Publish
        working-directory: packages/audio-reader-highlight
        run: npm publish --provenance --access public
